[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salespulse"
version = "0.1.0"
description = "AI sales quality agent — transcribe, score, coach, sync"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",       # File upload support

    # Task queue
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "flower>=2.0.0",                 # Celery monitoring UI

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",

    # ASR — local
    "faster-whisper>=1.0.0",

    # ASR — managed (optional; comment out if not using)
    "deepgram-sdk>=3.4.0",
    "assemblyai>=0.26.0",

    # Diarization
    "pyannote.audio>=3.1.0",
    "torch>=2.2.0",                  # Required by pyannote

    # Audio processing
    "pydub>=0.25.1",                 # Format conversion + resampling
    "soundfile>=0.12.1",             # WAV read/write

    # LLM clients
    "openai>=1.30.0",
    "anthropic>=0.28.0",

    # HTTP client (CRM adapters)
    "httpx>=0.27.0",

    # Voice agent (optional)
    "twilio>=9.2.0",
    "websockets>=12.0",
    "elevenlabs>=1.3.0",

    # Utilities
    "structlog>=24.1.0",
    "tenacity>=8.3.0",               # Retry with backoff
    "python-jose[cryptography]>=3.3.0",  # JWT for API auth
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "pyright>=1.1.370",
    "httpx>=0.27.0",                 # TestClient
    "fakeredis>=2.20.0",             # Redis mock for pipeline/state.py tests
]

[project.scripts]
salespulse-api = "salespulse.api.app:main"
salespulse-worker = "salespulse.pipeline.celery_app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/salespulse"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short"
